# External semiconductor datasets: manifests (scripts/prepare_external.py) and the
# one-class detector evaluation (scripts/run_external.py). No CLI args.

seed: 42

carinthia:                      # Carinthia-S, production SEM (Kofler & Hasic, Zenodo, CC BY 4.0)
  root: /autofs/space/crater_001/projects/micropath/semi/Carinthia-S/extracted/data
  normal_label: 6               # "no visible defect"; classes 1-5 are defects
  n_folds: 5                    # only 227 normals: rotate them through the memory bank
  seed: 0
  crop: 8                       # px removed on every side: the right border is 3 px on
                                # defect images and 2 px on normals (a label shortcut)
  seeds: [0]                    # bank seeds; the 5 folds already give the spread

texturead:                      # Texture-AD Wafer (Lei et al., arXiv:2409.06367, Apache-2.0)
  root: /autofs/space/crater_001/projects/micropath/semi/TextureAD-Wafer/extracted/wafer_mvtec_format
  n_folds: 2                    # photo-disjoint cross-fitting within each subclass
  seed: 0
  crop: 0
  seeds: [0]

output:
  dir: /autofs/space/crater_001/projects/micropath/semi/outputs/external   # manifests

extractors:
  frozen:
    type: dinov2
    dino_name: vit_small_patch14_reg4_dinov2.lvd142m
  adapted_anchor1_last4:        # patch-level adaptation trained on MIIC normals
    type: dinov2
    dino_name: vit_small_patch14_reg4_dinov2.lvd142m
    weights: /autofs/space/crater_001/projects/micropath/semi/outputs/patch_ssl/anchor1_last4/backbone.pth
  adapted_anchor0_last4:
    type: dinov2
    dino_name: vit_small_patch14_reg4_dinov2.lvd142m
    weights: /autofs/space/crater_001/projects/micropath/semi/outputs/patch_ssl/anchor0_last4/backbone.pth
  adapted_anchor1_all12:
    type: dinov2
    dino_name: vit_small_patch14_reg4_dinov2.lvd142m
    weights: /autofs/space/crater_001/projects/micropath/semi/outputs/patch_ssl/anchor1_all12/backbone.pth

scales:                         # as in configs/tiled.yaml
  - {name: g1_518, grid: 1, input_size: 518}
  - {name: g1_378, grid: 1, input_size: 378}
  - {name: g2_518, grid: 2, overlap: 0.25, input_size: 518}

methods:                        # a method = one extractor + one or more fused scales
  - {name: frozen_518,            extractor: frozen, scales: [g1_518]}
  - {name: frozen_378,            extractor: frozen, scales: [g1_378]}
  - {name: frozen_tiled_g2,       extractor: frozen, scales: [g2_518]}
  - {name: frozen_fuse_378_g2,    extractor: frozen, scales: [g1_378, g2_518]}

run:
  dir: /autofs/space/crater_001/projects/micropath/semi/outputs/external/run_smoke
  datasets: [carinthia, texturead]
  seeds: [0]
  limit_test: 6
  batch_size: 32
  calibration_fraction: 0.15    # of each task's normal pool, kept out of the bank
  memory:
    n_images: 15
    patches_per_tile: 256
    coreset_size: 100000
  eval:
    map_res: 128
    pixel_res: 128
